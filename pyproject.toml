[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Automated LinkedIn job discovery, LLM-powered scoring, and browser-based application tool for data engineering roles"
requires-python = ">=3.11"
authors = [
    {name = "Ankit Shandilya", email = "ankit.shandilya07@gmail.com"},
]
license = {text = "MIT"}
keywords = [
    "linkedin",
    "job-search",
    "automation",
    "data-engineering",
    "career",
    "ollama",
    "playwright",
    "scraper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "gspread>=6.0",
    "google-auth>=2.0",
    "playwright>=1.40",
    "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/ankit-shandilya/job-agent"
Source = "https://github.com/ankit-shandilya/job-agent"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
